name: Extract Artist Names

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install lbzip2
      run: sudo apt-get install lbzip2 -y
    - name: Run script
      run: python3 main.py
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.run_id }}
        name: Latest Filtered Database
        files: |
          artists.db
          